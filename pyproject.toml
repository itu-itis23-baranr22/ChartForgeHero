[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chartgen"
version = "0.1.0"
description = "Generate playable Clone Hero song folders from local audio files you own."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.16,<2",
    "soundfile>=0.13,<0.14",
    "librosa>=0.11,<0.12",
]

[project.optional-dependencies]
separation = ["torch>=2.9,<3", "demucs>=4.1,<5"]
editor = ["fastapi==0.162.2", "uvicorn==0.54.0"]
dev = ["pytest>=9,<10", "httpx==0.28.1"]

[project.scripts]
chartgen = "chartgen.cli:main"

[tool.setuptools.packages.find]
include = ["chartgen*"]

[tool.setuptools.package-data]
"chartgen.chart" = ["*.toml"]
"chartgen.audio" = ["*.toml"]
"chartgen.editor" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
addopts = '-m "not slow and not real"'
markers = [
    "slow: runs real Demucs on synthetic audio and may download model weights",
    "heavy: analyses long synthetic audio or builds a whole song; takes seconds, skipped by the pre-commit hook",
    "real: uses the owner's songs (CHARTGEN_MUSIC_DIR) or human charts (CHARTGEN_REFERENCE_DIR); runs Demucs when their stems are not cached yet",
]
testpaths = ["tests"]
pythonpath = ["."]
